server:
  port: 8080
spring:
  main:
    banner-mode: "off"
api:
  security:
    ## HMAC secret shared with the frontend (Node) issuer
    hmac:
      secret: ${HMAC_SECRET}
      time-window-ms: ${WINDOW_MS}
  ## OneBusAway Base URL
  base-url: ${OBA_BASE_URL}
## API KEY
  key: ${API_KEY}
## Agency ID
  agency: ${AGENCY_ID}